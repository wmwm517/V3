<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Shape of Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Caladea:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500&family=Gowun+Batang&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAE1CF; --paper-2:#F3ECDE; --ink:#2F2924; --ink-soft:rgba(47,41,36,.58);
  --sage:#9DBE84; --teal:#4F8F8E; --orange:#E19A3E; --red:#C24A2C;
  --mustard:#EDB24E; --coral:#CC5F48; --brown:#8F6534; --sand:#D5B48F;
  --sans:'Poppins','Gowun Dodum',system-ui,sans-serif;
  --serif:'Caladea','Gowun Batang',Georgia,serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .22 0 0 0 0 .17 0 0 0 0 .12 0 0 0 .9 -.38'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;word-break:keep-all}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit}

/* ---------- paper & world ---------- */
/* Scene 1 → texture1 (crumpled kraft), Scene 2·3 → texture2 (paper); crossfaded via body.tex2 */
#paper{position:fixed;inset:0;z-index:0;background:#EFE6D6}
#paper::before,#paper::after,#hdr::before,#hdr::after{content:'';position:absolute;inset:0;
  background-position:center;background-size:cover;background-repeat:no-repeat;background-attachment:fixed;
  transition:opacity 1.6s ease;pointer-events:none}
#paper::before,#hdr::before{background-image:url('texture1.jpg');opacity:0.2}
#paper::after,#hdr::after{background-image:url('texture2.jpg');opacity:0.1}
body.tex2 #paper::before,body.tex2 #hdr::before{opacity:0}
body.tex2 #paper::after,body.tex2 #hdr::after{opacity:0.2}
#hdr>*{position:relative;z-index:1}
#world{position:fixed;inset:0;width:100%;height:100%;z-index:1;mix-blend-mode:multiply;touch-action:none;display:block}
#gridRect{opacity:0;transition:opacity 1.6s ease}
body.grid-on #gridRect{opacity:1}

.node .nlabel{font:400 13px var(--sans);fill:var(--ink);pointer-events:none;transition:opacity .5s}
.node .body{transition:fill .9s ease}
.node .sel{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:3 6;vector-effect:non-scaling-stroke;
  transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.lhit{fill:none;stroke:transparent;stroke-width:20;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
body.s-drawing #me .lhit{pointer-events:stroke;cursor:pointer}
body.s-drawing #me .node{cursor:grab}
body.s-drawing.connecting #world{cursor:crosshair}
body.s-drawing.connecting #me .node{cursor:pointer}
body.s-explore #q-sub,body.s-explore #sub,body.s-explore #q-back{color:rgba(47,41,36,.82)}
/* the preview must never catch the click meant for the node beneath it */
#preview{pointer-events:none}
.xmark{pointer-events:none;transition:opacity .2s}
.dhit{fill:transparent;pointer-events:none}
body.s-discover .dhit, body.s-detail .dhit{pointer-events:all}
body.s-discover .diag .inner{cursor:zoom-in}
.dframe{fill:none;stroke:var(--ink);stroke-width:1.3;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .35s;pointer-events:none}
body.s-discover .diag:hover .dframe{opacity:.55}
.dcap{opacity:0;transition:opacity .8s;pointer-events:none}
body.s-discover .dcap, body.s-detail .dcap{opacity:1}
.dcap .dname{font:italic 400 40px var(--serif);fill:var(--ink)}
.dcap .dobs{font:300 22px var(--sans);fill:var(--ink);opacity:.72}
.diag{transition:opacity .7s ease}

/* ---------- header ---------- */
#hdr{position:fixed;left:0;right:0;top:0;height:99px;z-index:5;pointer-events:none;overflow:hidden;background:#EFE6D6}
#hdr .row{position:absolute;left:32px;right:240px;top:28px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 22px}
#hdr h1{margin:0;font:400 clamp(24px,3.3vw,44px)/1 'Monoton',var(--serif);letter-spacing:.015em;color:var(--ink);white-space:nowrap}
#sub{margin:0;font:italic 400 15px/1.3 var(--serif);color:var(--ink-soft);transition:opacity .5s}
#sub.fade{opacity:0}
#rule{position:absolute;left:0;top:96px;width:100%;height:8px;overflow:visible}

/* ---------- tape buttons ---------- */
.tape{--c:#4a4038;--fgc:#F6F0E4;border:0;background:none;padding:0;cursor:pointer;
  filter:drop-shadow(0 1.5px 1.2px rgba(70,50,30,.24));transform:rotate(var(--rot,0deg));
  transition:transform .28s cubic-bezier(.3,1.5,.5,1),filter .28s,opacity .3s}
.tape>span{display:block;padding:11px 24px 12px;font:400 15px/1.25 var(--sans);letter-spacing:.01em;color:var(--ink);
  background-color:rgba(238,228,206,.95);
  background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%,rgba(120,90,50,.08)),
    repeating-linear-gradient(92deg,rgba(255,255,255,.09) 0 1px,transparent 1px 4px),var(--grain);
  transition:background-color .3s,color .3s;white-space:nowrap}
.tape:hover{transform:rotate(0deg) translateY(-2px);filter:drop-shadow(0 5px 4px rgba(70,50,30,.24))}
.tape:hover>span{background-color:color-mix(in srgb,var(--c) 30%,rgb(238,228,206))}
.tape:active{transform:rotate(0deg) translateY(1px) scale(.97);filter:drop-shadow(0 .5px .5px rgba(70,50,30,.35))}
.tape:active>span,.tape.on>span{background-color:var(--c);color:var(--fgc)}
.tape.dim{opacity:.35;pointer-events:none}
.tape.small>span{padding:8px 18px 9px;font-size:13px}
.tape.big>span{padding:14px 30px 15px;font:italic 400 18px/1.2 var(--serif)}
.tape.in{animation:tapeIn .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d,0s)}
@keyframes tapeIn{from{opacity:0;transform:translateY(14px) rotate(calc(var(--rot,0deg)*3)) scale(.92)}}

/* ---------- explore ---------- */
#explore{position:fixed;left:0;right:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:0 20px;pointer-events:none;transition:opacity .7s ease}
#explore.gone{opacity:0}
#explore.gone *{pointer-events:none!important}
#q-wrap{display:flex;flex-direction:column;align-items:center;transition:opacity .45s ease,transform .45s ease}
#q-wrap.fade{opacity:0;transform:translateY(10px)}
#q-text{margin:0 0 10px;font:400 clamp(20px,2.2vw,28px)/1.55 var(--serif);color:var(--ink)}
#q-sub{margin:0 0 26px;font:italic 400 15px/1.6 var(--serif);color:var(--ink-soft);max-width:520px;min-height:1px}
#q-opts{display:flex;flex-wrap:wrap;gap:16px 18px;justify-content:center;max-width:760px;pointer-events:auto}
#steps{display:flex;gap:11px;margin-top:34px}
#steps i{width:9px;height:9px;border-radius:50%;border:1.3px solid var(--ink);opacity:.4;transition:all .5s}
#steps i.on{background:var(--c);border-color:var(--c);opacity:1}
#steps i.cur{opacity:.9;transform:scale(1.25)}
#q-back{margin-top:14px;background:none;border:0;font:italic 400 14px var(--serif);color:var(--ink-soft);cursor:pointer;pointer-events:auto;padding:6px 10px;transition:opacity .4s}
#q-back:hover{color:var(--ink)}
#q-back.off{opacity:0;pointer-events:none}

/* ---------- controls ---------- */
.ctl{position:fixed;z-index:12;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .6s ease,transform .6s cubic-bezier(.3,1.2,.5,1)}
.ctl.show{opacity:1;pointer-events:auto;transform:none}
.ctl.show *{pointer-events:auto}
#btnBack,#btnOverview{top:30px;right:30px}
#btnDone{right:30px;bottom:32px}
#discBtns{right:30px;bottom:32px;display:flex;gap:16px;align-items:center}
#discCap{left:32px;bottom:34px;font:italic 400 15px/1.6 var(--serif);color:var(--ink-soft);max-width:420px}

/* ---------- timeline ---------- */
#timeline{left:30px;right:230px;bottom:26px;height:60px;display:flex;align-items:center;gap:14px;transform:translateY(30px)}
#timeline.show{transform:none}
#timeline .tl-lab{font:italic 400 15px var(--serif);color:var(--ink-soft);white-space:nowrap}
.tl-track{position:relative;flex:1;height:100%;display:flex;gap:5px;padding:7px;mix-blend-mode:multiply}
.tl-track::before{content:'';position:absolute;inset:0;border:1.5px solid var(--ink);border-radius:3px;filter:url(#rough);pointer-events:none}
.tl-track::after{content:'';position:absolute;left:7px;right:7px;bottom:-8px;height:5px;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px calc(100%/24));opacity:.35}
.tl-cell{flex:1 1 0;min-width:6px;height:100%;position:relative;display:flex;align-items:flex-end;padding:0 8px 6px;
  border-radius:2px;cursor:pointer;transition:flex-grow .55s cubic-bezier(.3,1.2,.5,1),background-color .6s,box-shadow .25s;
  background-image:var(--grain)}
.tl-cell span{font:400 11px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.tl-cell:hover{box-shadow:inset 0 0 0 1.5px rgba(47,41,36,.5)}
.tl-cell.on{box-shadow:inset 0 0 0 2px var(--ink)}
body.s-detail .tl-cell{cursor:pointer}

/* ---------- caption / hint ---------- */
#caption{position:fixed;left:50%;bottom:108px;transform:translate(-50%,6px);z-index:12;font:italic 400 16px/1.5 var(--serif);
  color:var(--ink);text-align:center;opacity:0;transition:opacity .6s,transform .6s;pointer-events:none;padding:0 20px;width:max-content;max-width:92vw}
#caption.show{opacity:.85;transform:translate(-50%,0)}

/* ---------- radial menu ---------- */
#radial{position:fixed;left:0;top:0;width:0;height:0;z-index:20;pointer-events:none;--R:70px}
.rbtn{position:absolute;left:-27px;top:-27px;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
  background:var(--paper-2) var(--grain);display:grid;place-items:center;pointer-events:none;color:var(--ink);
  transform:translate(0,0) scale(.2);opacity:0;box-shadow:0 2px 6px rgba(60,40,20,.14);
  transition:transform .5s cubic-bezier(.3,1.55,.5,1),opacity .25s,background-color .2s}
.rbtn::before{content:'';position:absolute;inset:0;border:1.6px solid var(--ink);border-radius:50%;filter:url(#rough)}
.rbtn svg{width:24px;height:24px;overflow:visible}
.rbtn small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;font:400 10.5px var(--sans);letter-spacing:.08em;color:var(--ink);opacity:.8;white-space:nowrap}
#radial.show .rbtn{transform:translate(calc(var(--ux)*var(--R)),calc(var(--uy)*var(--R))) scale(1);opacity:1;pointer-events:auto}
#radial.show .rbtn:nth-child(2){transition-delay:.04s}
#radial.show .rbtn:nth-child(3){transition-delay:.08s}
#radial.show .rbtn:nth-child(4){transition-delay:.12s}
.rbtn:hover{background-color:#E8DDC7}
.rbtn:active{background-color:#DCCDB2}
.rbtn.off{opacity:.25!important;pointer-events:none!important}

/* ---------- bubbles ---------- */
.bubble{position:fixed;z-index:22;width:282px;padding:18px 20px 16px;background:var(--paper-2) var(--grain);
  box-shadow:0 8px 24px rgba(60,40,20,.16);animation:bubIn .38s cubic-bezier(.3,1.4,.5,1)}
.bubble::before{content:'';position:absolute;inset:0;border:1.6px solid var(--ink);border-radius:6px;filter:url(#rough);pointer-events:none}
.bubble{border-radius:6px}
@keyframes bubIn{from{opacity:0;transform:scale(.9)}}
.bubble .tail{position:absolute;width:18px;height:24px;left:-16px;top:40px;overflow:visible}
.bubble.right .tail{left:auto;right:-16px;transform:scaleX(-1)}
.f-lab{display:block;font:italic 400 13px var(--serif);color:var(--ink-soft);margin:0 0 3px}
.f-row{margin-bottom:14px}
.bubble input,.bubble textarea{width:100%;border:0;outline:none;background:transparent;color:var(--ink);padding:3px 0 5px;resize:none}
.bubble input{font:500 16px var(--sans);border-bottom:1.3px dashed rgba(47,41,36,.45)}
.bubble textarea{font:400 13px/24px var(--sans);height:50px;
  background:repeating-linear-gradient(180deg,transparent 0 23px,rgba(47,41,36,.28) 23px 24px)}
.bubble input::placeholder,.bubble textarea::placeholder{color:rgba(47,41,36,.38)}
#e-size{display:flex;align-items:center;gap:10px;font:italic 400 13px var(--serif);color:var(--ink-soft)}
#e-size .track{position:relative;flex:1;height:26px;cursor:pointer;touch-action:none}
#e-size .track svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#e-size .knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
#e-colors{display:flex;gap:7px;flex-wrap:wrap}
#e-colors button{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer;position:relative;transition:transform .2s}
#e-colors button:hover{transform:scale(1.15)}
#e-colors button svg{width:100%;height:100%;overflow:visible}
#e-colors button.on::after{content:'';position:absolute;inset:-4px;border:1.4px solid var(--ink);border-radius:50%;filter:url(#rough)}
.b-foot{display:flex;justify-content:flex-end;margin-top:6px}
#note h3{margin:0 0 6px;font:italic 400 21px/1.3 var(--serif)}
#note p{margin:0;font:400 13px/1.7 var(--sans);color:var(--ink);white-space:pre-wrap}
#note p.empty{color:var(--ink-soft);font-style:italic;font-family:var(--serif)}
#note{width:250px}

/* add button */
#addBtn{position:fixed;left:0;top:0;z-index:19}
#addBtn .inner{display:block;transform:translate(-50%,calc(-100% - 10px));animation:addIn .45s cubic-bezier(.3,1.6,.5,1)}
#addBtn::after{content:'';position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.55}
@keyframes addIn{from{opacity:0;transform:translate(-50%,-60%) scale(.4)}}

@media (max-width:760px){
  #hdr .row{left:18px;right:130px;top:22px}
  #hdr h1{font-size:19px}
  #rule{top:78px}
  #hdr{height:81px}
  #btnBack,#btnOverview{top:20px;right:14px}
  #timeline{left:14px;right:14px;bottom:86px;height:52px}
  #btnDone{right:14px;bottom:20px}
  #discBtns{right:14px;bottom:20px}
  #discCap{left:18px;bottom:84px;font-size:14px}
  #caption{bottom:150px}
  .tape>span{font-size:14px;padding:10px 18px 11px}
}
</style>
</head>
<body class="s-explore">

<!-- shared filters (pen-drawn borders) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<!-- paper ground: crumpled texture is painted into this layer at load -->
<div id="paper" aria-hidden="true"></div>

<!-- the world: one continuous space for all three scenes -->
<svg id="world">
  <defs>
    <pattern id="gridPat" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#2F2924" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <linearGradient id="pvGrad" gradientUnits="userSpaceOnUse"><stop id="pv1" offset=".12"/><stop id="pv2" offset=".9"/></linearGradient>
    <radialGradient id="shine" cx="34%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".32"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a2a18" stop-opacity=".12"/>
    </radialGradient>
  </defs>
  <g id="cam">
    <rect id="gridRect" x="-30000" y="-30000" width="60000" height="60000" fill="url(#gridPat)"/>
    <g id="diagrams"></g>
    <path id="preview" fill="url(#pvGrad)" opacity=".55"/>
  </g>
</svg>

<header id="hdr">
  <div class="row"><h1>THE SHAPE OF TODAY</h1><p id="sub"></p></div>
  <svg id="rule" preserveAspectRatio="none"><path id="rule1" fill="none" stroke="#2F2924" stroke-width="1.5" stroke-linecap="round"/><path id="rule2" fill="none" stroke="#2F2924" stroke-width=".8" stroke-opacity=".55"/></svg>
</header>

<!-- scene 1 -->
<section id="explore">
  <div id="q-wrap">
    <h2 id="q-text"></h2>
    <p id="q-sub"></p>
    <div id="q-opts"></div>
  </div>
  <div id="steps"></div>
  <button id="q-back" class="off">← 앞의 물음으로</button>
</section>

<!-- contextual controls -->
<div id="btnBack" class="ctl"></div>
<div id="btnDone" class="ctl"></div>
<div id="btnOverview" class="ctl"></div>
<div id="discBtns" class="ctl"></div>
<div id="discCap" class="ctl">다른 이들의 하루가 곁에 놓였습니다.<br>끌어서 둘러보고, 하나를 눌러 가까이 들여다보세요.</div>
<div id="timeline" class="ctl"><span class="tl-lab">아침</span><div class="tl-track" id="tlTrack"></div><span class="tl-lab">밤</span></div>
<div id="caption"></div>

<div id="addBtn" hidden><div class="inner"></div></div>

<div id="radial" hidden>
  <button class="rbtn" data-act="edit" style="--ux:-.72;--uy:-.72" aria-label="Edit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19l1.2-4.4L15.8 5a1.9 1.9 0 0 1 2.7 2.7L8.9 17.3z"/><path d="M4 21.2h9"/></svg><small>Edit</small></button>
  <button class="rbtn" data-act="shape" style="--ux:.72;--uy:-.72" aria-label="Shape">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9.5" cy="10" r="5.6"/><rect x="10.5" y="11" width="9" height="9" rx="2.2"/></svg><small>Shape</small></button>
  <button class="rbtn" data-act="connect" style="--ux:.72;--uy:.72" aria-label="Connect">
    <svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="3.6" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M7.5 12h8.5"/><path d="M21 7.5v9M16.5 12h9"/></svg><small>Connect</small></button>
  <button class="rbtn" data-act="delete" style="--ux:-.72;--uy:.72" aria-label="Delete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6.5 6.8l11 10.6M17.3 6.4L6.8 17.6"/></svg><small>Delete</small></button>
</div>

<div id="bubble" class="bubble" hidden>
  <svg class="tail" viewBox="0 0 18 24"><path d="M18 2 L1.5 12.5 L18 22" fill="#F3ECDE" stroke="#2F2924" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div class="f-row"><label class="f-lab" for="e-title">이 순간의 이름</label><input id="e-title" maxlength="20" placeholder="예: 늦은 아침" autocomplete="off"></div>
  <div class="f-row"><label class="f-lab" for="e-memo">짧은 메모</label><textarea id="e-memo" maxlength="70" placeholder="떠오르는 장면 하나"></textarea></div>
  <div class="f-row"><span class="f-lab">머문 만큼</span><div id="e-size"><span>잠깐</span><div class="track"><svg preserveAspectRatio="none"><path id="sizeLine" fill="none" stroke="#2F2924" stroke-width="1.5" stroke-linecap="round"/></svg><i class="knob"></i></div><span>오래</span></div></div>
  <div class="f-row"><span class="f-lab">빛깔</span><div id="e-colors"></div></div>
  <div class="b-foot" id="e-foot"></div>
</div>

<div id="note" class="bubble" hidden>
  <svg class="tail" viewBox="0 0 18 24"><path d="M18 2 L1.5 12.5 L18 22" fill="#F3ECDE" stroke="#2F2924" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <h3 id="n-title"></h3><p id="n-memo"></p>
</div>

<script>
(() => {
'use strict';
// ============================================================ basics
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); if(attrs) for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const f1=v=>Math.round(v*10)/10;
const ease={
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  out:t=>1-Math.pow(1-t,3),

function smoothClosed(p){
  const n=p.length; let d=`M${f1(p[0][0])},${f1(p[0][1])}`;
  for(let i=0;i<n;i++){
    const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    d+=`C${f1(p1[0]+(p2[0]-p0[0])/6)},${f1(p1[1]+(p2[1]-p0[1])/6)} ${f1(p2[0]-(p3[0]-p1[0])/6)},${f1(p2[1]-(p3[1]-p1[1])/6)} ${f1(p2[0])},${f1(p2[1])}`;
  }
  return d+'Z';
}
// hand-drawn outline: each shape gets a slight, deterministic wobble
function shapePath(shape,r,seed){
  const R=rng(seed); const ph=[R()*6.28,R()*6.28,R()*6.28,R()*6.28];
  const n=64, pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2; let k=1;
    if(shape==='square'){ const p=4.6; k=1/Math.pow(Math.pow(Math.abs(Math.cos(a)),p)+Math.pow(Math.abs(Math.sin(a)),p),1/p)*.97; }
    else if(shape==='hex'){ const seg=Math.PI/3; let m=((a+Math.PI/6)%seg)-seg/2; k=1/Math.cos(m); k=1+(k-1)*.8; }
    else if(shape==='pebble'){ k=1+.13*Math.sin(2*a+ph[0])+.06*Math.sin(3*a+ph[1]); }
    k*=1+.018*Math.sin(5*a+ph[2])+.011*Math.sin(9*a+ph[3]);
    pts.push([Math.cos(a)*r*k,Math.sin(a)*r*k]);
  }
  return smoothClosed(pts);
}
const flare=x=>1/(1+Math.pow(Math.max(x,0)/.95,3.2));
function closeOutline(L,R,last){
  const out=L.slice();
  for(let k=1;k<9;k++){ const ph=k/9*Math.PI, c=Math.cos(ph), s=Math.sin(ph);
    out.push([last.x-last.ty*last.w*c+last.tx*last.w*s, last.y+last.tx*last.w*c+last.ty*last.w*s]); }
  for(let i=R.length-1;i>=0;i--) out.push(R[i]);
  return smoothClosed(out);
}
// liquid bridge: wide where it leaves a node, pinched in the middle; p = how far the liquid has flowed
function bridge(A,B,rA,rB,bend,p,hv){
  const dx=B.x-A.x,dy=B.y-A.y,D=Math.hypot(dx,dy)||1, nx=-dy/D, ny=dx/D;
  const cx=(A.x+B.x)/2+nx*bend*D, cy=(A.y+B.y)/2+ny*bend*D;
  const neck=lerp(clamp(Math.min(rA,rB)*.17,2.6,8),1.3,hv), fl=lerp(.86,.45,hv), fB=smoothstep(.7,1,p);
  const N=46, L=[],R=[],C=[]; let last;
  for(let i=0;i<=N;i++){
    const t=p*i/N, mt=1-t;
    const x=mt*mt*A.x+2*mt*t*cx+t*t*B.x, y=mt*mt*A.y+2*mt*t*cy+t*t*B.y;
    let tx=2*mt*(cx-A.x)+2*t*(B.x-cx), ty=2*mt*(cy-A.y)+2*t*(B.y-cy); const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
    const fa=flare(Math.hypot(x-A.x,y-A.y)/rA), fb=flare(Math.hypot(x-B.x,y-B.y)/rB)*fB;
    let w=neck*(1-fa)*(1-fb)+rA*fl*fa+rB*fl*fb;
    if(p<1) w+=(1-fB)*neck*2.6*Math.pow(i/N,5);
    L.push([x-ty*w,y+tx*w]); R.push([x+ty*w,y-tx*w]); C.push([x,y]); last={x,y,tx,ty,w};
  }
  return {d:closeOutline(L,R,last),C,mid:C[N>>1]};
}
// liquid loop: a petal of liquid leaving the node and returning to it
function loopGeo(n,r,p,hv,ang){
  const Lr=r*2.05, Wd=r*1.4, ca=Math.cos(ang), sa=Math.sin(ang);
  const neck=lerp(clamp(r*.16,2.4,7),1.2,hv), fl=lerp(.84,.45,hv);
  const N=60, L=[],R=[],C=[]; let last;
  for(let i=0;i<=N;i++){
    const t=p*i/N, s=Math.sin(Math.PI*t);
    const lx=Lr*s*s, ly=Wd*.5*Math.sin(2*Math.PI*t);
    const dlx=Lr*Math.PI*Math.sin(2*Math.PI*t), dly=Wd*Math.PI*Math.cos(2*Math.PI*t);
    const x=n.x+lx*ca-ly*sa, y=n.y+lx*sa+ly*ca;
    let tx=dlx*ca-dly*sa, ty=dlx*sa+dly*ca; const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
    const fd=flare(Math.hypot(lx,ly)/r);
    let w=neck*(1-fd)+r*fl*fd; if(p<1) w+=neck*1.4*Math.pow(i/N,6)*(1-p);
    L.push([x-ty*w,y+tx*w]); R.push([x+ty*w,y-tx*w]); C.push([x,y]); last={x,y,tx,ty,w};
  }
  return {d:closeOutline(L,R,last),C,mid:C[N>>1]};
}

  const R=rng(seed); let d=`M${x0},${f1(y+(R()-.5)*amp)}`;

}
function roughRect(b,seed){
  const R=rng(seed), j=()=>(R()-.5)*10;

  }
}

function radiusOf(d,n){ return (d===me&&n.id==='seed')?lerp(coreR,nr(n),seedMode):nr(n); }

function updateDiagram(d){
  const now=performance.now(), isMe=d===me, alive=new Set();
  for(const n of d.nodes){
    alive.add(n.id);
    const e=nodeDOM(d,n), r=radiusOf(d,n), isSeed=isMe&&n.id==='seed';
    const key=n.shape+'|'+r.toFixed(1);
    if(e.key!==key){ const p=shapePath(n.shape,r,n.seed); e.body.setAttribute('d',p); e.shine.setAttribute('d',p); e.key=key; }
    e.body.style.fill=hex(n.color);
    let sc=n.s*(1+(n.pk||0)); if(isSeed) sc*=1+(1-seedMode)*.022*Math.sin(now/700)+pulseAmt;
    const sq=n.sq||0;
    e.g.setAttribute('transform',`translate(${f1(n.x)} ${f1(n.y)}) scale(${(sc*(1+sq)).toFixed(4)} ${(sc*(1-sq)).toFixed(4)})`);
    e.g.style.opacity=n.o.toFixed(3);
    e.g.style.display=(n.o<.01||sc<.003)?'none':'';
    if(e.lt!==n.title){ e.label.textContent=n.title; e.lt=n.title; }
    e.label.setAttribute('y',f1(r+((n.rings&&n.rings.length)?n.rings.length*5.5+12:0)+20));
    e.label.style.opacity=isSeed?seedMode:1;
    e.sel.setAttribute('r',f1(r+10+((n.rings&&n.rings.length)?n.rings.length*5.5:0)));
    e.sel.style.display=(isMe&&state.scene==='drawing'&&(ui.sel===n.id||(ui.connect&&ui.ctarget===n.id)))?'':'none';
    // rings
    const rings=n.rings||[];
    while(e.ringEls.length<rings.length) e.ringEls.push(el('path',{fill:'none','stroke-linecap':'round',pathLength:1,'stroke-dasharray':'1 1'},e.rings));
    while(e.ringEls.length>rings.length) e.ringEls.pop().remove();
    const m=isSeed?seedMode:1;
    rings.forEach((rg,i)=>{
      const p=e.ringEls[i], R=lerp(66+15.5*i,r+7+5.5*i,m), w=lerp(8.5,2.6,m), k=R.toFixed(1);
      if(p._k!==k){ p.setAttribute('d',shapePath('circle',R,rg.seed)); p._k=k; }
      p.setAttribute('stroke',hex(rg.color)); p.setAttribute('stroke-width',w.toFixed(2));
      p.setAttribute('stroke-dashoffset',(1-rg.prog).toFixed(4)); p.setAttribute('transform',`rotate(${rg.rot})`);
    });
  }
  for(const [id,e] of d.nodeEls) if(!alive.has(id)){ e.g.remove(); d.nodeEls.delete(id); }
  // links
  const aliveL=new Set();
  for(const l of d.links){
    const A=findNode(d,l.a), B=findNode(d,l.b); if(!A||!B) continue;
    aliveL.add(l.id);
    const e=linkDOM(d,l);
    const tgt=(isMe&&(ui.hover===l.id||ui.armed===l.id))?1:0; l.hv+=(tgt-l.hv)*.2; if(Math.abs(tgt-l.hv)<.004) l.hv=tgt;
    const rA=radiusOf(d,A)*A.s, rB=radiusOf(d,B)*B.s;
    if(rA<.5||(l.a!==l.b&&rB<.5)){ e.fill.setAttribute('d',''); continue; }
    const gh=l.hv-(l.splash||0)*.9;
    const geo=l.a===l.b?loopGeo(A,rA,l.p,gh,l.ang):bridge(A,B,rA,rB,l.bend,l.p,gh);
    e.fill.setAttribute('d',geo.d);
    const ca=mix(hex(A.color),INK,l.hv*.82), cb=mix(hex(B.color),INK,l.hv*.82);
    if(l.a===l.b){ e.grad.setAttribute('x1',A.x); e.grad.setAttribute('y1',A.y); e.grad.setAttribute('x2',geo.mid[0]); e.grad.setAttribute('y2',geo.mid[1]); }
    else { e.grad.setAttribute('x1',A.x); e.grad.setAttribute('y1',A.y); e.grad.setAttribute('x2',B.x); e.grad.setAttribute('y2',B.y); }
    e.s1.setAttribute('stop-color',ca); e.s2.setAttribute('stop-color',l.a===l.b?mix(ca,'#ffffff',.18):cb);
    e.fill.style.opacity=(Math.min(A.o,B.o)*l.o).toFixed(3);
    e.hit.setAttribute('d','M'+geo.C.filter((_,i)=>i%2===0).map(p=>f1(p[0])+','+f1(p[1])).join('L'));
    e.hit.style.display=(l.p<1||l.dead||A.hidden||B.hidden)?'none':'';
    e.x.setAttribute('transform',`translate(${f1(geo.mid[0])} ${f1(geo.mid[1])}) scale(${(1/cam.z).toFixed(3)})`);
    e.x.setAttribute('opacity',clamp((l.hv-.35)/.6,0,1).toFixed(2));
  }
  for(const [id,e] of d.linkEls) if(!aliveL.has(id)){ e.fill.remove(); e.hit.remove(); e.x.remove(); e.grad.remove(); d.linkEls.delete(id); }
}

function bboxLocal(d){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const n of d.nodes){ if(n.hidden||n.dead) continue;
    const r=radiusOf(d,n)+((n.rings&&n.rings.length)?n.rings.length*5.5+8:0);
    x0=Math.min(x0,n.x-r); x1=Math.max(x1,n.x+r); y0=Math.min(y0,n.y-r); y1=Math.max(y1,n.y+r+30); }
  for(const l of d.links){ if(l.a!==l.b||l.dead) continue; const n=findNode(d,l.a); if(!n||n.hidden) continue;
    const r=radiusOf(d,n), px=n.x+Math.cos(l.ang)*r*2.6, py=n.y+Math.sin(l.ang)*r*2.6;
    x0=Math.min(x0,px-r*.6); x1=Math.max(x1,px+r*.6); y0=Math.min(y0,py-r*.6); y1=Math.max(y1,py+r*.6); }
  if(!isFinite(x0)) return {x0:-100,y0:-100,x1:100,y1:100};
  return {x0,y0,x1,y1};
}
const KNUM=['','한','두','세','네','다섯','여섯','일곱','여덟','아홉','열'];
const kn=n=>n<=10?KNUM[n]:String(n);
function observe(d){
  const ns=d.nodes.filter(n=>!n.hidden&&!n.dead), ls=d.links.filter(l=>!l.dead);
  const lp=ls.filter(l=>l.a===l.b).length, ln=ls.length-lp;
  let s=`${kn(ns.length)} 개의 순간`;
  s+=ln?`, ${kn(ln)} 갈래의 이어짐`:', 서로 떨어진 채로';
  if(lp) s+=`, ${kn(lp)} 번 되돌아온 자리`;
  return s;
}
function setCaption(d,name){
  const b=bboxLocal(d), cx=(b.x0+b.x1)/2;
  d.capName.textContent=name; d.capObs.textContent=observe(d);
  d.capName.setAttribute('x',cx); d.capName.setAttribute('y',b.y1+52);
  d.capObs.setAttribute('x',cx); d.capObs.setAttribute('y',b.y1+88);
  const lb={x0:Math.min(b.x0,cx-230)-40,x1:Math.max(b.x1,cx+230)+40,y0:b.y0-40,y1:b.y1+120};
  d.lb=lb; d.nb=b;
  d.hit.setAttribute('x',lb.x0); d.hit.setAttribute('y',lb.y0); d.hit.setAttribute('width',lb.x1-lb.x0); d.hit.setAttribute('height',lb.y1-lb.y0);
  d.frame.setAttribute('d',roughRect(lb,hashStr(d.id)));
}
function setDiagT(d,k){

function buildSamples(){
  samples=SAMPLE_DATA.map((s,i)=>{
    const d={id:'s'+i,name:s.n,ox:0,oy:0,nodes:[],links:[]};
    s.N.forEach((a,j)=>d.nodes.push({id:'s'+i+'n'+j,x:a[0],y:a[1],size:a[2],color:a[3],shape:SHAPE_CODE[a[4]],title:a[5],memo:a[6],
      seed:hashStr('s'+i+'n'+j),s:1,o:1,rings:j===0?s.r.map((c,k)=>({color:c,prog:1,rot:(hashStr(s.n+k)%360),seed:hashStr(s.n)+k})):[]}));
    s.L.forEach((l,j)=>{
      const lk={id:'l'+j,a:'s'+i+'n'+l[0],b:'s'+i+'n'+l[1],p:1,o:1,hv:0,bend:((hashStr(s.n+j)%2)?1:-1)*(.05+(hashStr(s.n+'b'+j)%60)/1000),ang:0};
      if(l[0]===l[1]) lk.ang=loopAngle(d,findNode(d,lk.a),lk.a);
      d.links.push(lk);
    });
    buildDiagramDOM(d); updateDiagram(d); setCaption(d,s.n);
    d.g.style.display='none'; d.g.style.opacity=0;
    return d;
  });
}
function layoutSamples(){
  const b=bboxLocal(me), mcx=(b.x0+b.x1)/2, mcy=(b.y0+b.y1)/2;
  const ex={x0:b.x0-140,x1:b.x1+140,y0:b.y0-120,y1:b.y1+180};
  const CW=800, CH=560, cells=[];
  for(let gy=-5;gy<=5;gy++) for(let gx=-5;gx<=5;gx++){
    const off=(Math.abs(gy)%2)?CW/2:0, x=gx*CW+off, y=gy*CH;
    cells.push({cx:mcx+x,cy:mcy+y,r:Math.hypot(x,y*1.25)});
  }
  cells.sort((a,b)=>a.r-b.r);
  let i=0;
  for(const c of cells){
    if(i>=samples.length) break;
    const s=samples[i], lb=s.lb, w=lb.x1-lb.x0, h=lb.y1-lb.y0;
    const rect={x0:c.cx-w/2,x1:c.cx+w/2,y0:c.cy-h/2,y1:c.cy+h/2};
    if(rect.x0<ex.x1&&rect.x1>ex.x0&&rect.y0<ex.y1&&rect.y1>ex.y0) continue;
    const R=rng(hashStr(s.id)+7);
    s.ox=c.cx-(lb.x0+lb.x1)/2+(R()-.5)*90; s.oy=c.cy-(lb.y0+lb.y1)/2+(R()-.5)*70;
    s.dist=c.r; i++;
  }
}

function torn(){
  const L=[],R=[],n=7;
  for(let i=0;i<=n;i++){ const y=(i/n*100).toFixed(1); L.push(`${(Math.random()*5).toFixed(1)}px ${y}%`); R.unshift(`calc(100% - ${(Math.random()*5).toFixed(1)}px) ${y}%`); }
  return `polygon(${L.concat(R).join(',')})`;
}
function tape(label,opt){
  opt=opt||{};
  const b=document.createElement('button'); b.className='tape '+(opt.cls||'');
  const s=document.createElement('span'); s.innerHTML=label; s.style.clipPath=torn(); b.appendChild(s);
  if(opt.color){ b.style.setProperty('--c',hex(opt.color)); b.style.setProperty('--fgc',LIGHT.has(opt.color)?INK:'#F6F0E4'); }
  b.style.setProperty('--rot',((Math.random()*2-1)*(opt.tilt??2.2)).toFixed(2)+'deg');

const qWrap=$('#q-wrap'), qText=$('#q-text'), qSub=$('#q-sub'), qOpts=$('#q-opts'), stepsEl=$('#steps'), qBack=$('#q-back');
for(let i=0;i<QUESTIONS.length;i++) stepsEl.appendChild(document.createElement('i'));
function renderSteps(){
  [...stepsEl.children].forEach((d,i)=>{ d.classList.toggle('on',!!answers[i]); d.classList.toggle('cur',i===step);
    if(answers[i]) d.style.setProperty('--c',hex(answers[i].color)); });

  qWrap.classList.add('fade');
  setTimeout(()=>{ fillStep(i); requestAnimationFrame(()=>qWrap.classList.remove('fade')); },immediate?30:470);
}
function fillStep(i){
  step=i; qOpts.innerHTML='';
  const add=(b,k)=>{ b.classList.add('in'); b.style.setProperty('--d',(.12+k*.09)+'s'); qOpts.appendChild(b); };
  if(i<0){
    qText.innerHTML='오늘을<br>천천히 떠올려 볼까요.';
    qSub.textContent='맞고 틀린 답은 없어요. 떠오르는 대로 고르면, 가운데의 점이 조금씩 오늘을 닮아 갑니다.';
    add(tape('시작하기',{cls:'big',onClick:()=>showStep(0)}),0);
  } else if(i<QUESTIONS.length){
    const Q=QUESTIONS[i]; qText.innerHTML=Q.q; qSub.textContent='';
    Q.o.forEach((o,j)=>add(tape(o[0],{color:o[1],onClick:e=>answer(i,j,e.currentTarget)}),j));
  } else {
    qText.innerHTML=`${RING_WORDS[answers.length-1]} 겹의 결이 모였어요.<br>이 결에서부터 오늘을 펼쳐 봅니다.`;
    qSub.textContent=answers.map(a=>a.label).join('  ·  ');
    add(tape('하루 그리기  →',{cls:'big',onClick:()=>enterDrawing()}),0);
  }

}

  btn.classList.add('on'); [...qOpts.children].forEach(b=>{ if(b!==btn) b.classList.add('dim'); });
  const o=QUESTIONS[i].o[j]; answers[i]={label:o[0],color:o[1]};
  addRing(o[1]); renderSteps();
  setTimeout(()=>{ busy=false; showStep(i+1); },1150);
}
function addRing(color){
  const s=seedNode();
  const rg={color,prog:0,rot:Math.floor(Math.random()*360),seed:Math.floor(Math.random()*1e6)};
  s.rings.push(rg);
  if(s.rings.length===1) s.color=color;
  tween(1300,k=>rg.prog=k,ease.inOut);
  const c0=coreR, c1=16+5.8*s.rings.length; tween(900,k=>coreR=lerp(c0,c1,k),ease.out);
  tween(1400,k=>pulseAmt=Math.sin(Math.PI*k)*.07*(1-k*.3),ease.out,()=>pulseAmt=0);
}

  if(rg) unwindRing(rg,after); else after();
  showStep(idx);
});

function enterDrawing(){
  if(state.scene!=='explore') return;
  setScene('trans'); exploreUI.classList.add('gone'); hideCaption();
  const s=seedNode(); if(!s.title) s.title='오늘';
  const m0=seedMode; tween(1500,k=>seedMode=lerp(m0,1,k),ease.inOut);
  camTo(savedDrawCam||defaultDrawCam(),1600);
  document.body.classList.add('tex2');
  setTimeout(()=>document.body.classList.add('grid-on'),350);
  setSub('Drawing  ·  오늘의 모양을 그리는 시간');
  // restore the nodes that were set aside while answering again
  let k=0;
  for(const n of me.nodes){ if(n.id==='seed'||!n.hidden) continue;
    n.hidden=false; n.o=0; n.s=.2; const d=900+k*110; k++;
    tween(300,t=>n.o=t,ease.out,null,d); tween(750,t=>n.s=lerp(.2,1,t),ease.pop,null,d); }
  for(const l of me.links){ const d=1100+k*60; tween(600,t=>l.o=t,ease.out,null,d); }
  setTimeline(me);
  setTimeout(()=>{
    setScene('drawing'); showCtls(['btnBack','btnDone','timeline']); tlDirty=true;
    if(!hinted){ hinted=true; showCaption('빈 곳을 눌러 순간을 더하고, 순간을 눌러 잇거나 다듬어 보세요.',7000); }
  },1450);
}
function backToExplore(){
  if(state.scene!=='drawing') return;
  closeUI(); savedDrawCam={...cam}; setScene('trans'); showCtls([]); hideCaption();
  document.body.classList.remove('grid-on');
  setSub('Explore  ·  오늘을 천천히 떠올리는 시간'); document.body.classList.remove('tex2');
  for(const n of me.nodes){ if(n.id==='seed') continue; n.hidden=true; const o0=n.o; tween(450,t=>n.o=o0*(1-t),ease.out); }
  for(const l of me.links){ const o0=l.o; tween(350,t=>l.o=o0*(1-t),ease.out); }
  const s=seedNode();
  const m0=seedMode; tween(1300,k=>seedMode=lerp(m0,0,k),ease.inOut,null,250);
  s.rings.forEach((rg,i)=>unwindRing(rg,null));
  setTimeout(()=>{ s.rings.length=0; s.color='ink'; const c0=coreR; tween(500,k=>coreR=lerp(c0,16,k),ease.out); },700);
  camTo(exploreCam(),1400,()=>{

}
function nextColor(){
  const list=[...new Set(answers.map(a=>a.color)),...PALETTE];
  const used=me.nodes.length; return list[used%list.length];
}
function addNodeAt(p){
  const n={id:uid('m'),x:p.x,y:p.y,size:.38,color:nextColor(),shape:'circle',title:'',memo:'',seed:Math.floor(Math.random()*1e6),s:.04,o:1,rings:[]};
  me.nodes.push(n); tlDirty=true;
  tween(780,k=>n.s=lerp(.04,1,k),ease.pop);
  hideCaption();
}
function loopAngle(d,n,id){
  let sx=0,sy=0;
  for(const l of d.links){ if(l.dead||l.a===l.b) continue; const o=l.a===id?l.b:l.b===id?l.a:null; if(!o) continue;
    const m=findNode(d,o); if(!m) continue; const dx=m.x-n.x,dy=m.y-n.y,L=Math.hypot(dx,dy)||1; sx+=dx/L; sy+=dy/L; }
  return (sx||sy)?Math.atan2(-sy,-sx):-Math.PI/2.6;
}
// a quick, damped wobble — the node "receives" or "releases" liquid
function jiggle(n,amp,dur){
  tween(dur||700,k=>{ const d=Math.exp(-4.2*k); n.pk=amp*d*Math.cos(k*Math.PI*5); n.sq=amp*.9*d*Math.sin(k*Math.PI*6); },ease.lin,()=>{n.pk=0;n.sq=0;});
}
function addLink(a,b,from){
  // `from` continues the hover preview so the liquid never jumps back to the source
  const p0=from?from.p:0, bend=from?from.bend:(Math.random()<.5?-1:1)*(.05+Math.random()*.07);
  const l={id:uid('l'),a,b,p:p0,o:1,hv:0,bend,ang:from&&a===b?from.ang:0};
  if(a===b&&!from) l.ang=loopAngle(me,findNode(me,a),a);
  me.links.push(l);
  const A=findNode(me,a), B=findNode(me,b);
  jiggle(A,-.06,520);
  // stretch → overshoot a touch → settle, so the bridge "snaps" like a drop of ink meeting water
  const dur=lerp(a===b?1100:950,420,p0);
  tween(dur,k=>l.p=p0+(1-p0)*k,ease.inOut,()=>{ l.p=1; jiggle(B,.11,820); l.splash=1; tween(700,k=>l.splash=1-k,ease.out); });
}
function removeLink(l){
  if(l.dead) return; l.dead=true; ui.armed=null; ui.hover=null;
  tween(320,k=>{l.o=1-k;},ease.out,()=>{ me.links=me.links.filter(x=>x!==l); });
}
function removeNode(n){
  if(n.id==='seed'||n.dead) return; n.dead=true;
  for(const l of me.links) if(l.a===n.id||l.b===n.id) removeLink(l);
  const s0=n.s;
  tween(380,k=>n.s=s0*(1-k)*(1+.25*Math.sin(k*Math.PI)),ease.inOut,()=>{ me.nodes=me.nodes.filter(x=>x!==n); tlDirty=true; });

}
function cycleShape(n){

// ---- connect mode: the liquid tip follows the cursor; over a node it is drawn toward it
const linkExists=(a,b)=>me.links.some(l=>!l.dead&&((l.a===a&&l.b===b)||(l.a===b&&l.b===a)));
function startConnect(n){
  ui.connect=n.id; ui.ctarget=null; hideRadial(); document.body.classList.add('connecting');

  ui.cbend=(Math.random()<.5?-1:1)*(.06+Math.random()*.06);

}
function cancelConnect(){

}
function setConnectTarget(id){
  if(!ui.connect) return;
  if(id&&id!==ui.connect&&linkExists(ui.connect,id)) id=null;          // already joined: don't invite
  if(id&&id===ui.connect&&linkExists(id,id)) id=null;
  if(id===ui.ctarget) return;

  if(id){ const t=findNode(me,id); if(t) jiggle(t,.07,600); }
}
function connectTo(id){
  const from=ui.connect, tip=ui.tip, snapped=ui.ctarget===id;
  const carry=snapped&&tip?{p:tip.p,bend:tip.bend,ang:tip.ang}:null;
  cancelConnect();
  if(!from||!findNode(me,id)) return;
  if(id===from){ if(!linkExists(from,from)) addLink(from,from,carry&&tip.loop>.5?carry:null); }
  else if(!linkExists(from,id)) addLink(from,id,carry&&tip.loop<.5?carry:null);

// per-frame: ease the preview tip toward the cursor (free) or toward the hovered node (snapped)
function updateConnectPreview(){
  const n=ui.connect&&findNode(me,ui.connect), tip=ui.tip;
  if(!n||!tip||state.scene!=='drawing'){ if(previewEl.getAttribute('d')) previewEl.setAttribute('d',''); return; }
  const now=performance.now(), rA=radiusOf(me,n)*n.s, c=s2w(ui.cursor.x,ui.cursor.y);
  const t=ui.ctarget&&findNode(me,ui.ctarget), self=t===n;
  const k=.2;
  if(t&&!self){
    const rt=radiusOf(me,t)*t.s;
    tip.x+=(t.x-tip.x)*k; tip.y+=(t.y-tip.y)*k; tip.r+=(rt-tip.r)*k;
    tip.p+=((.8+.035*Math.sin(now/170))-tip.p)*k; tip.bend+=(ui.cbend-tip.bend)*k; tip.loop+=(0-tip.loop)*k;
  } else if(self){
    tip.loop+=(1-tip.loop)*k*.8; tip.p+=((.72+.04*Math.sin(now/170))-tip.p)*k;
  } else {
    tip.x+=(c.x-tip.x)*.45; tip.y+=(c.y-tip.y)*.45; tip.r+=(11-tip.r)*k;
    tip.p+=(1-tip.p)*k; tip.bend+=(0-tip.bend)*k; tip.loop+=(0-tip.loop)*k;
  }
  let geo=null;
  if(tip.loop>.5) geo=loopGeo(n,rA,tip.p*tip.grow,0,tip.ang);
  else if(Math.hypot(tip.x-n.x,tip.y-n.y)>rA*1.05) geo=bridge(n,tip,rA,Math.max(tip.r,1),tip.bend,tip.p*tip.grow,0);
  previewEl.setAttribute('d',geo?geo.d:'');
  const g=$('#pvGrad'); g.setAttribute('x1',n.x); g.setAttribute('y1',n.y); g.setAttribute('x2',tip.x); g.setAttribute('y2',tip.y);
  $('#pv1').setAttribute('stop-color',hex(n.color));
  $('#pv2').setAttribute('stop-color',t&&!self?hex(t.color):hex(n.color));
  previewEl.setAttribute('opacity',(t?.82:.5).toFixed(2));
}

const svg=$('#world'), pts=new Map(); let G=null, pinch=null;
const interactive=()=>['drawing','discover','detail'].includes(state.scene);
const zRange=()=>state.scene==='drawing'?[.35,2.4]:[.1,3];
function zoomAt(sx,sy,z){

svg.addEventListener('pointerdown',e=>{
  if(!interactive()||camTw) return;

  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},cam:{...cam}}; G=null; return; }
  const t=e.target, q=s=>{ const x=t.closest&&t.closest(s); return x?x.getAttribute(s.slice(1,-1)):null; };
  G={id:e.pointerId,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,type:e.pointerType,
     node:q('[data-node]'),link:q('[data-link]'),diag:q('[data-diagram]')};
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
});

  ui.cursor={x:e.clientX,y:e.clientY};

  if(pinch&&pts.size>=2){
    const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const [lo,hi]=zRange(), z=clamp(pinch.cam.z*d/pinch.d,lo,hi);
    const wx=(pinch.m.x-W/2)/pinch.cam.z+pinch.cam.x, wy=(pinch.m.y-H/2)/pinch.cam.z+pinch.cam.y;
    cam.z=z; cam.x=wx-(m.x-W/2)/z; cam.y=wy-(m.y-H/2)/z; return;
  }
  if(!G||G.id!==e.pointerId){

      const nd=e.target.closest&&e.target.closest('#me [data-node]'); setConnectTarget(nd?nd.getAttribute('data-node'):null);
    }
    else if(e.pointerType==='mouse'&&state.scene==='drawing'){
      const l=e.target.closest&&e.target.closest('[data-link]'); ui.hover=l?l.getAttribute('data-link'):null;
    }
    return;
  }
  const dx=e.clientX-G.lx, dy=e.clientY-G.ly; G.lx=e.clientX; G.ly=e.clientY;
  if(!G.moved&&Math.hypot(e.clientX-G.sx,e.clientY-G.sy)>6){
    G.moved=true;
    if(G.node&&state.scene==='drawing'&&!ui.connect&&findNode(me,G.node)){ G.drag=true; hideRadial(); hideAdd(); closeEdit(); ui.armed=null; ui.sel=G.node; }
    else { hideAdd(); }
  }
  if(!G.moved) return;
  if(G.drag){ const n=findNode(me,G.node); if(n){ n.x+=dx/cam.z; n.y+=dy/cam.z; tlDirty=true; } }
  else { cam.x-=dx/cam.z; cam.y-=dy/cam.z; }

function endPointer(e){

  if(!G||G.id!==e.pointerId) return;
  const g=G; G=null;
  if(g.drag){ ui.sel=null; tlDirty=true; }
  if(!g.moved&&e.type==='pointerup') onTap(g,e);
}
svg.addEventListener('pointerup',endPointer);
svg.addEventListener('pointercancel',endPointer);
svg.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') ui.hover=null; });
svg.addEventListener('wheel',e=>{
  if(!interactive()||camTw) return; e.preventDefault();
  zoomAt(e.clientX,e.clientY,cam.z*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)));
},{passive:false});

function onTap(g,e){
  const sc=state.scene;
  if(sc==='drawing'){
    if(ui.connect){ if(g.node&&g.diag==='me') connectTo(g.node); else cancelConnect(); return; }
    if(g.link&&g.diag==='me'){
      const l=me.links.find(x=>x.id===g.link); if(!l) return;
      if(g.type==='mouse'||ui.armed===l.id) removeLink(l);
      else { hideRadial(); hideAdd(); closeEdit(); ui.sel=null; ui.armed=l.id; }
      return;
    }
    if(g.node&&g.diag==='me'){
      const n=findNode(me,g.node); if(!n||n.dead) return;
      const same=ui.sel===n.id&&!radial.hidden;
      closeUI(); if(!same) openRadial(n);
      return;
    }
    if(anyOpen()){ closeUI(); return; }
    showAdd(s2w(e.clientX,e.clientY));
  } else if(sc==='discover'){
    if(g.diag) zoomInto(g.diag);
  } else if(sc==='detail'){
    if(g.diag===detailDiag.id&&g.node){ const n=findNode(detailDiag,g.node); if(n) openNote(detailDiag,n); }
    else if(g.diag&&g.diag!==detailDiag.id){ zoomInto(g.diag); }
    else closeNote();
  }
}
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(state.scene==='drawing') closeUI();
    else if(state.scene==='detail') backToOverview();
  }
});

// ============================================================ main loop
function frame(now){
  runTweens(now);
  updateDiagram(me);
  updateConnectPreview();
  camG.setAttribute('transform',`translate(${f1(W/2)} ${f1(H/2)}) scale(${cam.z.toFixed(5)}) translate(${(-cam.x).toFixed(2)} ${(-cam.y).toFixed(2)})`);
  positionOverlays();
  if(tlDirty) renderTimeline();
  requestAnimationFrame(frame);
}


function onResize(){
  W=innerWidth; H=innerHeight; drawRule(); layoutExplore();
  if(state.scene==='explore'){ const c=exploreCam(); cam.x=c.x; cam.y=c.y; cam.z=c.z; }
}
addEventListener('resize',onResize);

// ============================================================ boot
buildDiagramDOM(me); me.lb={x0:0,x1:0,y0:0,y1:0};
onResize();
Object.assign(cam,exploreCam());
setSub('Explore  ·  오늘을 천천히 떠올리는 시간');
fillStep(-1); qWrap.classList.add('fade'); requestAnimationFrame(()=>requestAnimationFrame(()=>qWrap.classList.remove('fade')));
requestAnimationFrame(frame);
window.__day={me,state,cam,ui,get samples(){return samples}};
})();
</script>
